name: Weekly Dawn-to-Dusk Calendar

on:
  push:
    # Avoid re-running when the bot commits only the generated calendar
    paths-ignore:
      - "**.ics"
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove previous calendar files
        run: rm -f *.ics

      - name: Generate calendar
        run: python dawn-to-dusk.py

      - name: Commit and push calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.ics
          if git diff --staged --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update dawn-to-dusk calendar for $(date -u +%Y-%m-%d)"
            git push
          fi
